name: Deploy to EC2

# IMPORTANT: Before first deployment, manually upload serviceAccount.json to EC2:
# ssh ec2-user@<EC2_HOST> "mkdir -p ~/secrets"
# scp demos/lec9/server/serviceAccount.json ec2-user@<EC2_HOST>:~/secrets/

on:
  push:
    branches:
      - test-ci

env:
  NODE_VERSION: '18'
  DEPLOY_PATH_CLIENT: /var/www/lec9-client
  DEPLOY_PATH_SERVER: /var/www/lec9-server
  PM2_APP_NAME: lec9-server
  WORKING_DIR: demos/lec9

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # Build client locally
      - name: Install and build client
        working-directory: ${{ env.WORKING_DIR }}/client
        run: |
          npm ci
          # Copy .env.example to .env.production for build
          if [ -f .env.example ]; then
            cp .env.example .env.production
          fi
          npm run build

      # Install server dependencies locally (just to verify package.json)
      - name: Install server dependencies
        working-directory: ${{ env.WORKING_DIR }}/server
        run: |
          npm ci

      # Create directories on EC2 before deploying
      - name: Create directories on EC2
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 2m
          script: |
            sudo mkdir -p ${{ env.DEPLOY_PATH_CLIENT }}
            sudo mkdir -p ${{ env.DEPLOY_PATH_SERVER }}
            sudo chown -R ${{ secrets.EC2_USER }}:${{ secrets.EC2_USER }} /var/www/

      # Deploy client to EC2
      - name: Deploy client to EC2
        uses: easingthemes/ssh-deploy@v4.1.10
        env:
          SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_KEY }}
          ARGS: '-rltgoDzvO --delete'
          SOURCE: '${{ env.WORKING_DIR }}/client/dist/'
          REMOTE_HOST: ${{ secrets.EC2_HOST }}
          REMOTE_USER: ${{ secrets.EC2_USER }}
          TARGET: ${{ env.DEPLOY_PATH_CLIENT }}

      # Deploy server to EC2 (including local .env and serviceAccount.json)
      - name: Deploy server to EC2
        uses: easingthemes/ssh-deploy@v4.1.10
        env:
          SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_KEY }}
          ARGS: '-rltgoDzvO --delete --exclude=node_modules'
          SOURCE: '${{ env.WORKING_DIR }}/server/'
          REMOTE_HOST: ${{ secrets.EC2_HOST }}
          REMOTE_USER: ${{ secrets.EC2_USER }}
          TARGET: ${{ env.DEPLOY_PATH_SERVER }}

      # Setup server and restart
      - name: Setup server and restart application
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 10m
          script: |
            # Ensure directories exist
            mkdir -p ${{ env.DEPLOY_PATH_CLIENT }}
            mkdir -p ${{ env.DEPLOY_PATH_SERVER }}

            # Install ALL server dependencies (including dev deps for TypeScript compilation)
            cd ${{ env.DEPLOY_PATH_SERVER }}
            npm ci

            # Install TypeScript globally if not present
            npm list -g typescript || npm install -g typescript

            # Copy serviceAccount.json from persistent location
            if [ -f ~/secrets/serviceAccount.json ]; then
              echo "✅ Copying serviceAccount.json from ~/secrets/"
              cp ~/secrets/serviceAccount.json ./serviceAccount.json
            else
              echo "❌ Error: serviceAccount.json not found in ~/secrets/"
              echo ""
              echo "To fix this, run these commands from your local machine:"
              echo "ssh ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} 'mkdir -p ~/secrets'"
              echo "scp demos/lec9/server/serviceAccount.json ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:~/secrets/"
              echo ""
              exit 1
            fi

            # Compile TypeScript
            echo "Starting TypeScript compilation..."
            npx tsc
            TSC_EXIT_CODE=$?

            if [ $TSC_EXIT_CODE -ne 0 ]; then
              echo "❌ TypeScript compilation failed with exit code $TSC_EXIT_CODE"
              exit 1
            fi
            echo "✅ TypeScript compilation successful"

            # Verify server.js was created
            if [ -f server.js ]; then
              echo "✅ server.js file created successfully"
            else
              echo "❌ server.js file not found after compilation"
              exit 1
            fi

            # Clean up dev dependencies after compilation to save space
            echo "Pruning dev dependencies..."
            npm prune --production

            # Install PM2 globally if not present
            echo "Checking PM2 installation..."
            npm list -g pm2 || npm install -g pm2

            # Start or restart server with PM2
            echo "Starting/restarting server with PM2..."
            pm2 delete ${{ env.PM2_APP_NAME }} 2>/dev/null || true
            pm2 start server.js --name ${{ env.PM2_APP_NAME }} \
              --max-memory-restart 500M \
              --time \
              --log-date-format "YYYY-MM-DD HH:mm:ss Z"

            # Save PM2 process list
            echo "Saving PM2 process list..."
            pm2 save

            # Setup PM2 to start on boot (only needs to be done once)
            echo "Setting up PM2 startup..."
            pm2 startup systemd -u ${{ secrets.EC2_USER }} --hp /home/${{ secrets.EC2_USER }} || true

            # Setup Nginx configuration for client (if nginx is installed)
            if command -v nginx &> /dev/null; then
              # Create nginx config for React app
              sudo tee /etc/nginx/sites-available/lec9-client << 'EOF'
            server {
                listen 80;
                listen [::]:80;
                server_name _;

                root ${{ env.DEPLOY_PATH_CLIENT }};
                index index.html;

                # Serve static files
                location / {
                    try_files \$uri \$uri/ /index.html;
                }

                # API proxy
                location /api/ {
                    proxy_pass http://localhost:5000/;
                    proxy_http_version 1.1;
                    proxy_set_header Upgrade \$http_upgrade;
                    proxy_set_header Connection 'upgrade';
                    proxy_set_header Host \$host;
                    proxy_cache_bypass \$http_upgrade;
                    proxy_set_header X-Real-IP \$remote_addr;
                    proxy_set_header X-Forwarded-For \$proxy_add_x_forwarded_for;
                    proxy_set_header X-Forwarded-Proto \$scheme;
                }

                # Gzip compression
                gzip on;
                gzip_vary on;
                gzip_min_length 1024;
                gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json;
            }
            EOF

              # Remove default site and enable our site
              sudo rm -f /etc/nginx/sites-enabled/default
              sudo ln -sf /etc/nginx/sites-available/lec9-client /etc/nginx/sites-enabled/ || true

              # Test and reload nginx
              sudo nginx -t && sudo systemctl reload nginx || echo "Nginx configuration failed"
            else
              echo "Nginx not installed - client will need to be served differently"
            fi

            # Show deployment status
            echo "========================================="
            echo "✅ Deployment completed!"
            echo "========================================="
            echo "Server status:"
            pm2 status
            echo ""
            echo "Client deployed to: ${{ env.DEPLOY_PATH_CLIENT }}"
            echo "Server deployed to: ${{ env.DEPLOY_PATH_SERVER }}"

      # Health check
      - name: Health check
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 2m
          script: |
            # Wait for server to be ready
            sleep 5

            # Check if server is running
            if pm2 list | grep -q "${{ env.PM2_APP_NAME }}.*online"; then
              echo "✅ Server is running"

              # Try to make a health check request (adjust endpoint as needed)
              if curl -f http://localhost:5000/health 2>/dev/null; then
                echo "✅ Server health check passed"
              else
                echo "⚠️ Server is running but health check failed or endpoint doesn't exist"
              fi
            else
              echo "❌ Server is not running properly"
              pm2 logs ${{ env.PM2_APP_NAME }} --lines 20
              exit 1
            fi